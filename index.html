<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="skeleton.css">
  <link rel="stylesheet" href="normalize.css">
  <title>Branch Name</title>
  <style>
    input[type="text"] {
      width: 100%;
      max-width: 542px;
    }
    .mt-1 {
      margin-top: 16px;
    }
    .mb-1 {
      margin-bottom: 16px;
    }
    .mr-1 {
      margin-right: 8px;
    }
    .m-0 {
      margin: 0;
    }
    .field {
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="display: flex; align-items: center">
      Branch name generator
    </h1>
    <form class="generate-form">
      <label for="task-name">Ключ и название задачи <img style="margin-bottom: 0px;" width="48" height="11" src="https://www.ph4.ru/DL/LOGO/y/ya_tracker_.gif" alt=""></label>
      <input type="text" id="task-name">
      <div class="mt-1 mb-1" id="ticket-link-wrapper" style="display: none;">
        <a id="ticket-link" href="#" target="_blank" rel="noopener noreferrer">Открыть тикет в трекере</a>
      </div>
      <div class="mt-1 mb-1">
        <button type="button" id="copy-name">
          Скопировать название тикета
        </button>
      </div>
      <label for="branch-name">Название ветки</label>
      <input type="text" id="branch-name" value="ODIN" />
      <label>Целевая ветка</label>
      <div class="field mt-1">
        <input class="mr-1" type="radio" name="destination" value="staging" id="dest-staging"><label class="m-0" for="dest-staging">staging</label>
      </div>
      <div class="field mt-1">
        <input checked class="mr-1" type="radio" name="destination" value="master" id="dest-master"><label class="m-0" for="dest-master">master</label>
      </div>
      <div class="field mt-1">
        <input class="mr-1" type="radio" name="sep" value="-" id="dash"><label class="m-0" for="dash">Разделять слова с помощью -</label>
      </div>
      <div class="field mt-1">
        <input checked class="mr-1" type="radio" name="sep" value="_" id="underscore"><label class="m-0" for="underscore">Разделять слова с помощью _</label>
      </div>
    </form>
    <button id="copy">
      Скопировать
    </button>
    <button id="copy-git">
      Скопировать с git-командами
    </button>
    <button id="refresh">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" height="16" width="16"><path d="M24 40q-6.65 0-11.325-4.675Q8 30.65 8 24q0-6.65 4.675-11.325Q17.35 8 24 8q4.25 0 7.45 1.725T37 14.45V8h3v12.7H27.3v-3h8.4q-1.9-3-4.85-4.85Q27.9 11 24 11q-5.45 0-9.225 3.775Q11 18.55 11 24q0 5.45 3.775 9.225Q18.55 37 24 37q4.15 0 7.6-2.375 3.45-2.375 4.8-6.275h3.1q-1.45 5.25-5.75 8.45Q29.45 40 24 40Z"/></svg>
    </button>
    <div><span id="result"></span></div>
  </div>
  <script>
    let sep = '_';
    const ticketNumberRegExp = /[A-Z]+-[0-9]+/;
    function getTicketNumber(el) {
      const match = el.match(ticketNumberRegExp);
      return match ? match[0] : '';
    }
    function getBranch(el) {
      const ticketNumber = getTicketNumber(el);
      const ticketName = el.replace(ticketNumberRegExp, '');
      const cleared = ticketName.replace(/[^A-Za-zА-Яа-яЁё0-9]/g, ' ');
      if (cleared.slice(-1) === ' ') {
        return ticketNumber + cleared.slice(0, -1).replace(/ +/g, sep);
      }
      return ticketNumber + cleared.replace(/ +/g, sep)
    }
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll('#dash,#underscore').forEach((el) => {
        el.addEventListener('input', () => {
          sep = el.value;
          onChange();
        });
      });
      const taskNameInput = document.getElementById("task-name");
      const valueOutput = document.getElementById("branch-name");
      const btn = document.getElementById("copy");
      const btnGit = document.getElementById("copy-git");
      const btnName = document.getElementById("copy-name");
      const refresh = document.getElementById("refresh");
      const ticketLinkWrapper = document.getElementById("ticket-link-wrapper");
      const ticketLink = document.getElementById("ticket-link");
      const BTN_TEXT = 'Скопировать';
      const BTN_GIT_TEXT = 'Скопировать с git-командами';
      const BTN_NAME_TEXT = 'Скопировать название тикета';
      const onRefresh = () => {
        btn.classList.remove('button-primary');
        btnGit.classList.remove('button-primary');
        btnName.classList.remove('button-primary');
        btnName.textContent = BTN_NAME_TEXT;
        btn.textContent = BTN_TEXT
        btnGit.textContent = BTN_GIT_TEXT
        document.querySelector('#result').textContent = ''
      }
      const flashCopied = (button, originalText, copiedText) => {
        button.textContent = copiedText;
        button.classList.add('button-primary');
        setTimeout(() => {
          button.textContent = originalText;
          button.classList.remove('button-primary');
        }, 1000);
      }
      const updateTicketLink = () => {
        const ticketNumber = getTicketNumber(taskNameInput.value);
        if (ticketNumber) {
          ticketLink.href = `https://tracker.yandex.ru/${ticketNumber}`;
          ticketLinkWrapper.style.display = '';
        } else {
          ticketLinkWrapper.style.display = 'none';
        }
      }
      const onChange = () => {
        valueOutput.value = getBranch(taskNameInput.value);
        updateTicketLink();
        onRefresh();
      }
      const copyInputValue = (input) => {
        input.select();
        input.setSelectionRange(0, 99999); /* For mobile devices */
        navigator.clipboard.writeText(input.value);
      }
      taskNameInput.addEventListener('input', onChange);
      taskNameInput.addEventListener('click', () => taskNameInput.select());
      btnName.addEventListener('click', () => {
        copyInputValue(taskNameInput);
        flashCopied(btnName, BTN_NAME_TEXT, 'Название тикета скопировано');
      })
      btn.addEventListener('click', () => {
        copyInputValue(valueOutput);
        flashCopied(btn, BTN_TEXT, 'Скопировано');
      })
      btnGit.addEventListener('click', () => {
        const destinationInput = document.querySelector('input[name="destination"]:checked');
        const destination = destinationInput ? destinationInput.value : 'master';
        const toCopy = `git checkout ${destination} && git pull && git checkout -b  ${valueOutput.value}`
        navigator.clipboard.writeText(toCopy);
        flashCopied(btnGit, BTN_GIT_TEXT, 'Скопировано');
        document.querySelector('#result').textContent = `Скопировано: ${toCopy}`
      })
      refresh.addEventListener('click', onRefresh)
    })
  </script>
</body>
</html>
